<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos - Mis Enlaces</title>
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="carlosundaprofile.jpg" alt="Foto de Perfil" class="profile-pic" id="display-foto">
        <h1 id="display-nombre">Carlos</h1>
        <p id="display-desc">Comediante, Creador de Contenido y Productor Audiovisual</p>

        <h2 id="titulo-shows" class="seccion-titulo">🎫 Shows y Entradas</h2>
        <div class="links" id="contenedor-shows" style="margin-bottom: 25px;"></div>

        <h2 id="titulo-destacado" class="seccion-titulo">⭐ Destacado</h2>
        <div class="links" id="contenedor-destacado" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-redes" class="seccion-titulo">Redes Sociales</h2>
        <div class="links" id="contenedor-redes" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-youtube" class="seccion-titulo">▶️ YouTube</h2>
        <div class="links" id="contenedor-youtube" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-videosgen" class="seccion-titulo">⏯️ Videos</h2>
        <div class="links" id="contenedor-videosgen" style="margin-bottom: 25px;"></div>

        <div class="qr-slider-container" id="contenedor-slider-general">
            <h2>Escanea y Sígueme</h2>
            <div class="qr-slider-viewport">
                <div class="qr-slider-track" id="sliderTrack">
                    <div class="slide"><h3 class="title-ig"><i class="fab fa-instagram"></i> Instagram</h3><img src="qr-instagram.png" alt="QR Instagram" class="qr-code"></div>
                    <div class="slide"><h3 class="title-tk"><i class="fab fa-tiktok"></i> TikTok</h3><img src="qr-tiktok.png" alt="QR TikTok" class="qr-code"></div>
                    <div class="slide"><h3 class="title-yt"><i class="fab fa-youtube"></i> YouTube</h3><img src="qr-youtube.png" alt="QR YouTube" class="qr-code"></div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Carlos. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNyzguxQ8g3_xXRisuk01SKVaZ4H9JLxI",
            authDomain: "mis-enlaces-panel.firebaseapp.com",
            projectId: "mis-enlaces-panel",
            storageBucket: "mis-enlaces-panel.firebasestorage.app",
            messagingSenderId: "27134948574",
            appId: "1:27134948574:web:1d261e7ced5c7f9c9e7e4f",
            measurementId: "G-FST917JFZ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarPerfil() {
            try {
                const docSnap = await getDoc(doc(db, "configuracion", "perfil"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.foto) document.getElementById('display-foto').src = data.foto;
                    if(data.nombre) document.getElementById('display-nombre').innerText = data.nombre;
                    if(data.descripcion) document.getElementById('display-desc').innerText = data.descripcion;
                }
            } catch (error) { console.error(error); }
        }

        async function fetchAndSort(coleccionStr) {
            const snapshot = await getDocs(collection(db, coleccionStr));
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
            return items;
        }

        function dibujarBotones(items, contenedorId, tituloId, estiloExtra = "") {
            const contenedor = document.getElementById(contenedorId);
            const titulo = document.getElementById(tituloId);
            if (items.length > 0) {
                titulo.style.display = 'block'; 
                contenedor.innerHTML = ''; 
                items.forEach((data) => {
                    const boton = document.createElement('a');
                    boton.href = data.url;
                    boton.className = 'btn';
                    if(estiloExtra) boton.style.border = estiloExtra; 
                    boton.target = '_blank';
                    boton.innerHTML = `<i class="${data.icono}"></i> ${data.titulo}`;
                    contenedor.appendChild(boton);
                });
            } else { titulo.style.display = 'none'; }
        }

        function dibujarShows(items, contenedorId, tituloId) {
            const contenedor = document.getElementById(contenedorId);
            const titulo = document.getElementById(tituloId);
            if (items.length > 0) {
                titulo.style.display = 'block'; 
                contenedor.innerHTML = ''; 
                items.forEach((data) => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    
                    // Creamos el enlace seguro para Google Maps combinando dirección y lugar
                    const busquedaMapa = encodeURIComponent(`${data.direccionShow} ${data.lugarShow || ''}`);
                    const urlMapa = `https://www.google.com/maps/search/?api=1&query=${busquedaMapa}`;

                    card.innerHTML = `
                        ${data.imagen ? `<img src="${data.imagen}" alt="${data.titulo}" class="event-img">` : ''}
                        <div class="event-info">
                            <div class="event-title">${data.titulo}</div>
                            ${data.lugarShow ? `<div class="event-detail"><i class="fas fa-map-marker-alt"></i> <b>Lugar:</b> ${data.lugarShow}</div>` : ''}
                            
                            ${data.direccionShow ? `
                                <div class="event-detail">
                                    <i class="fas fa-location-arrow"></i> 
                                    <b>Dirección:</b>&nbsp;
                                    <a href="${urlMapa}" target="_blank" style="color: #1e88e5; text-decoration: none; font-weight: 600;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                                        ${data.direccionShow} <i class="fas fa-external-link-alt" style="font-size: 0.75rem; color: #1e88e5; margin-left: 2px;"></i>
                                    </a>
                                </div>` : ''}
                            
                            ${data.fechaShow ? `<div class="event-detail"><i class="fas fa-calendar-alt"></i> <b>Fecha:</b> ${data.fechaShow}</div>` : ''}
                            ${data.horaShow ? `<div class="event-detail"><i class="fas fa-clock"></i> <b>Hora:</b> ${data.horaShow}</div>` : ''}
                            <a href="${data.url}" target="_blank" class="event-btn"><i class="fas fa-ticket-alt"></i> Entradas</a>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } else { titulo.style.display = 'none'; }
        }

        async function cargarTodo() {
            await cargarPerfil(); 
            try {
                dibujarBotones(await fetchAndSort("redes"), 'contenedor-redes', 'titulo-redes');

                const recomendadosFull = await fetchAndSort("videos");
                const destacados = recomendadosFull.filter(v => v.icono === "fas fa-star");
                const youtube = recomendadosFull.filter(v => v.icono === "fab fa-youtube");
                const shows = recomendadosFull.filter(v => v.icono === "fas fa-ticket-alt");
                const videosGen = recomendadosFull.filter(v => v.icono === "fas fa-play-circle");

                dibujarBotones(destacados, 'contenedor-destacado', 'titulo-destacado', '2px solid #FFD700'); 
                dibujarBotones(youtube, 'contenedor-youtube', 'titulo-youtube', '2px solid #FF0000'); 
                dibujarShows(shows, 'contenedor-shows', 'titulo-shows'); 
                dibujarBotones(videosGen, 'contenedor-videosgen', 'titulo-videosgen', '2px solid #555'); 

                const qrsItems = await fetchAndSort("qrs");
                const track = document.getElementById('sliderTrack');
                if(qrsItems.length > 0) {
                    qrsItems.forEach((data) => {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        slide.innerHTML = `<h3 class="${data.colorClass}"><i class="${data.icono}"></i> ${data.titulo}</h3><img src="${data.imagenUrl}" alt="QR" class="qr-code">`;
                        track.appendChild(slide);
                    });
                }

                const slides = document.querySelectorAll('.slide');
                let currentIndex = 0;
                setInterval(() => {
                    currentIndex++;
                    if (currentIndex >= slides.length) currentIndex = 0; 
                    track.style.transform = `translateX(-${currentIndex * 100}%)`;
                }, 3500);
            } catch (error) { console.error("Error:", error); }
        }
        cargarTodo();
    </script>
</body>
</html>
