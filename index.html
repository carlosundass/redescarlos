<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos - Mis Enlaces</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="carlosundaprofile.jpg" alt="Foto de Carlos" class="profile-pic">
        
        <h1>Carlos</h1>
        <p>Comediante, Creador de Contenido y Productor Audiovisual</p>

        <!-- Slider de QR -->
        <div class="qr-slider-container" id="contenedor-slider-general">
            <h2>Escanea y Sígueme</h2>
            <div class="qr-slider-viewport">
                <div class="qr-slider-track" id="sliderTrack">
                    <!-- QRs Base -->
                    <div class="slide"><h3 class="title-ig"><i class="fab fa-instagram"></i> Instagram</h3><img src="qr-instagram.png" alt="QR Instagram" class="qr-code"></div>
                    <div class="slide"><h3 class="title-tk"><i class="fab fa-tiktok"></i> TikTok</h3><img src="qr-tiktok.png" alt="QR TikTok" class="qr-code"></div>
                    <div class="slide"><h3 class="title-yt"><i class="fab fa-youtube"></i> YouTube</h3><img src="qr-youtube.png" alt="QR YouTube" class="qr-code"></div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 1: REDES SOCIALES -->
        <h2 id="titulo-redes" class="seccion-titulo">Redes Sociales</h2>
        <div class="links" id="contenedor-redes"></div>

        <!-- SECCIÓN 2: RECOMENDADOS -->
        <h2 id="titulo-recomendados" class="seccion-titulo">Recomendados</h2>
        <div class="links" id="contenedor-videos"></div>
    </div>

    <footer>
        <p>&copy; 2026 Carlos. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNyzguxQ8g3_xXRisuk01SKVaZ4H9JLxI",
            authDomain: "mis-enlaces-panel.firebaseapp.com",
            projectId: "mis-enlaces-panel",
            storageBucket: "mis-enlaces-panel.firebasestorage.app",
            messagingSenderId: "27134948574",
            appId: "1:27134948574:web:1d261e7ced5c7f9c9e7e4f",
            measurementId: "G-FST917JFZ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchAndSort(coleccionStr) {
            const snapshot = await getDocs(collection(db, coleccionStr));
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
            return items;
        }

        function dibujarBotones(items, contenedorId, tituloId, estiloExtra = "") {
            const contenedor = document.getElementById(contenedorId);
            const titulo = document.getElementById(tituloId);
            
            if (items.length > 0) {
                titulo.style.display = 'block'; // Muestra el título solo si hay items
                contenedor.innerHTML = ''; 
                items.forEach((data) => {
                    const boton = document.createElement('a');
                    boton.href = data.url;
                    boton.className = 'btn';
                    if(estiloExtra) boton.style.border = estiloExtra; 
                    boton.target = '_blank';
                    boton.innerHTML = `<i class="${data.icono}"></i> ${data.titulo}`;
                    contenedor.appendChild(boton);
                });
            } else {
                titulo.style.display = 'none'; // Lo oculta si está vacío
            }
        }

        async function cargarTodo() {
            try {
                const redes = await fetchAndSort("redes");
                dibujarBotones(redes, 'contenedor-redes', 'titulo-redes');

                const videos = await fetchAndSort("videos");
                dibujarBotones(videos, 'contenedor-videos', 'titulo-recomendados', '2px solid #333'); 

                const qrsItems = await fetchAndSort("qrs");
                const track = document.getElementById('sliderTrack');
                if(qrsItems.length > 0) {
                    qrsItems.forEach((data) => {
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        slide.innerHTML = `<h3 class="${data.colorClass}"><i class="${data.icono}"></i> ${data.titulo}</h3><img src="${data.imagenUrl}" alt="QR" class="qr-code">`;
                        track.appendChild(slide);
                    });
                }

                const slides = document.querySelectorAll('.slide');
                let currentIndex = 0;
                setInterval(() => {
                    currentIndex++;
                    if (currentIndex >= slides.length) currentIndex = 0; 
                    track.style.transform = `translateX(-${currentIndex * 100}%)`;
                }, 3500);
            } catch (error) {
                console.error("Error:", error);
            }
        }

        cargarTodo();
    </script>
</body>
</html>
