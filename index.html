<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos - Mis Enlaces</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="carlosundaprofile.jpg" alt="Foto de Carlos" class="profile-pic">
        
        <h1>Carlos</h1>
        <p>Comediante, Creador de Contenido y Productor Audiovisual</p>

        <!-- NUEVO: Contenedor del Slider de QR -->
        <div class="qr-slider-container">
            <h2>Escanea y Sígueme</h2>
            
            <div class="qr-slider-viewport">
                <div class="qr-slider-track" id="sliderTrack">
                    
                    <!-- Slide Instagram -->
                    <div class="slide">
                        <h3 class="title-ig"><i class="fab fa-instagram"></i> Instagram</h3>
                        <img src="qr-instagram.png" alt="QR Instagram" class="qr-code">
                    </div>

                    <!-- Slide TikTok -->
                    <div class="slide">
                        <h3 class="title-tk"><i class="fab fa-tiktok"></i> TikTok</h3>
                        <img src="qr-tiktok.png" alt="QR TikTok" class="qr-code">
                    </div>

                    <!-- Slide YouTube -->
                    <div class="slide">
                        <h3 class="title-yt"><i class="fab fa-youtube"></i> YouTube</h3>
                        <img src="qr-youtube.png" alt="QR YouTube" class="qr-code">
                    </div>

                    <!-- Slide Podcast -->
                    <div class="slide">
                        <h3 class="title-pd"><i class="fas fa-podcast"></i> Quién Lo Iba A Decir</h3>
                        <img src="qr-podcast.png" alt="QR Podcast" class="qr-code">
                    </div>

                </div>
            </div>
        </div>

        <!-- Tus enlaces en formato botón -->
        <div class="links">
            <a href="#" class="btn" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            <a href="#" class="btn" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="#" class="btn" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
            <a href="#" class="btn" target="_blank"><i class="fas fa-podcast"></i> Podcast: Quién Lo Iba A Decir</a>
            <a href="#" class="btn" target="_blank"><i class="fas fa-camera"></i> unrecuerdo.cl</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Carlos. Todos los derechos reservados.</p>
    </footer>

    <!-- NUEVO: Script para que el Slider se mueva solo -->
    <script>
        const track = document.getElementById('sliderTrack');
        const slides = document.querySelectorAll('.slide');
        let currentIndex = 0;

        function moveToNextSlide() {
            currentIndex++;
            if (currentIndex >= slides.length) {
                currentIndex = 0; // Vuelve al principio
            }
            // Mueve el carrusel calculando el porcentaje
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        // Cambia de QR cada 3.5 segundos
        setInterval(moveToNextSlide, 3500);
    </script>
</body>
</html>
