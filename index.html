<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos - Mis Enlaces</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="carlosundaprofile.jpg" alt="Foto de Carlos" class="profile-pic">
        
        <h1>Carlos</h1>
        <p>Comediante, Creador de Contenido y Productor Audiovisual</p>

        <!-- Slider de QR Dinámico -->
        <div class="qr-slider-container" id="contenedor-slider-general" style="display:none;">
            <h2>Escanea y Sígueme</h2>
            <div class="qr-slider-viewport">
                <div class="qr-slider-track" id="sliderTrack">
                    <!-- Los QR aparecerán aquí desde Firebase -->
                </div>
            </div>
        </div>

        <!-- Redes Sociales Dinámicas -->
        <div class="links" id="contenedor-redes">
            <!-- Cargando redes... -->
        </div>

        <!-- Sección de Videos Dinámicos -->
        <h2 style="font-size: 1.2rem; margin: 35px 0 15px 0; color: #444; border-bottom: 2px solid #ddd; padding-bottom: 5px;">Recomendados</h2>
        <div class="links" id="contenedor-videos">
            <!-- Cargando videos... -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Carlos. Todos los derechos reservados.</p>
    </footer>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ PEGA AQUÍ TU FIREBASE CONFIG EXACTA ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyCNyzguxQ8g3_xXRisuk01SKVaZ4H9JLxI",
            authDomain: "mis-enlaces-panel.firebaseapp.com",
            projectId: "mis-enlaces-panel",
            storageBucket: "mis-enlaces-panel.firebasestorage.app",
            messagingSenderId: "27134948574",
            appId: "1:27134948574:web:1d261e7ced5c7f9c9e7e4f",
            measurementId: "G-FST917JFZ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para renderizar botones normales (Redes o Videos)
        function dibujarBotones(querySnapshot, contenedorId, estiloExtra = "") {
            const contenedor = document.getElementById(contenedorId);
            contenedor.innerHTML = ''; // Limpiar carga
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const boton = document.createElement('a');
                boton.href = data.url;
                boton.className = 'btn';
                if(estiloExtra) boton.style.border = estiloExtra; // Para destacar los videos
                boton.target = '_blank';
                boton.innerHTML = `<i class="${data.icono}"></i> ${data.titulo}`;
                contenedor.appendChild(boton);
            });
        }

        // Cargar todo al inicio
        async function cargarTodo() {
            try {
                // 1. Cargar Redes
                const qRedes = query(collection(db, "redes"), orderBy("fecha", "desc"));
                dibujarBotones(await getDocs(qRedes), 'contenedor-redes');

                // 2. Cargar Videos
                const qVideos = query(collection(db, "videos"), orderBy("fecha", "desc"));
                dibujarBotones(await getDocs(qVideos), 'contenedor-videos', '2px solid #ff0000'); // Videos con borde rojo

                // 3. Cargar QRs
                const qQrs = query(collection(db, "qrs"), orderBy("fecha", "desc"));
                const qrsSnapshot = await getDocs(qQrs);
                const track = document.getElementById('sliderTrack');
                
                if(!qrsSnapshot.empty) {
                    document.getElementById('contenedor-slider-general').style.display = 'block';
                    qrsSnapshot.forEach((doc) => {
                        const data = doc.data();
                        const slide = document.createElement('div');
                        slide.className = 'slide';
                        slide.innerHTML = `
                            <h3 class="${data.colorClass}"><i class="${data.icono}"></i> ${data.titulo}</h3>
                            <img src="${data.imagenUrl}" alt="QR" class="qr-code">
                        `;
                        track.appendChild(slide);
                    });

                    // Iniciar la animación del Slider solo si hay QRs cargados
                    const slides = document.querySelectorAll('.slide');
                    let currentIndex = 0;
                    setInterval(() => {
                        currentIndex++;
                        if (currentIndex >= slides.length) currentIndex = 0; 
                        track.style.transform = `translateX(-${currentIndex * 100}%)`;
                    }, 3500);
                }

            } catch (error) {
                console.error("Error conectando a Firebase:", error);
            }
        }

        cargarTodo();
    </script>
</body>
</html>
