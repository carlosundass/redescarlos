<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claudia Aravena Etchegaray - Enlaces</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="claudia.jpeg" alt="Foto de Claudia Aravena Etchegaray" class="profile-pic" id="display-foto">
        <h1 id="display-nombre">Claudia Aravena Etchegaray</h1>
        <p id="display-desc">Actriz y Coach Actoral</p>

        <div class="qr-slider-container">
            <h2>Escanea y Sígueme</h2>
            <div class="qr-grid" id="qrGrid">
                
                <div class="qr-item">
                    <a href="https://www.instagram.com/claudiaaravena/" target="_blank" class="qr-link">
                        <h3 class="title-ig"><i class="fab fa-instagram"></i> Instagram Claudia</h3>
                    </a>
                    <img src="qr-ig-claudia.png" alt="QR IG Claudia" class="qr-code">
                </div>

                <div class="qr-item">
                    <a href="https://www.tiktok.com/@claustandup" target="_blank" class="qr-link">
                        <h3 class="title-tk"><i class="fab fa-tiktok"></i> TikTok Claudia</h3>
                    </a>
                    <img src="qr-tk-claudia.png" alt="QR TK Claudia" class="qr-code">
                </div>

                <div class="qr-item">
                    <a href="https://www.instagram.com/laclaketacl" target="_blank" class="qr-link">
                        <h3 class="title-ig"><i class="fab fa-instagram"></i> Instagram La Claketa</h3>
                    </a>
                    <img src="qr-ig-claketa.png" alt="QR IG Claketa" class="qr-code">
                </div>

                <div class="qr-item">
                    <a href="https://laclaketa.cl/" target="_blank" class="qr-link">
                        <h3 class="title-pd"><i class="fas fa-globe"></i> Web La Claketa</h3>
                    </a>
                    <img src="qr-web-claketa.png" alt="QR Web Claketa" class="qr-code">
                </div>

            </div>
        </div>

        <h2 id="titulo-redes" class="seccion-titulo">Redes Sociales</h2>
        <div class="links" id="contenedor-redes" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-destacado" class="seccion-titulo">⭐ Destacado</h2>
        <div class="links" id="contenedor-destacado" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-youtube" class="seccion-titulo">▶️ YouTube</h2>
        <div class="links" id="contenedor-youtube" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-shows" class="seccion-titulo">🎫 Shows y Entradas</h2>
        <div class="links" id="contenedor-shows" style="margin-bottom: 15px;"></div>

        <h2 id="titulo-videosgen" class="seccion-titulo">⏯️ Videos</h2>
        <div class="links" id="contenedor-videosgen" style="margin-bottom: 15px;"></div>

    </div>

    <footer>
        <p>&copy; 2026 Claudia Aravena Etchegaray. Todos los derechos reservados.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCNyzguxQ8g3_xXRisuk01SKVaZ4H9JLxI",
            authDomain: "mis-enlaces-panel.firebaseapp.com",
            projectId: "mis-enlaces-panel",
            storageBucket: "mis-enlaces-panel.firebasestorage.app",
            messagingSenderId: "27134948574",
            appId: "1:27134948574:web:1d261e7ced5c7f9c9e7e4f",
            measurementId: "G-FST917JFZ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarPerfil() {
            try {
                const docSnap = await getDoc(doc(db, "configuracion", "perfil_claudia"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(data.foto) document.getElementById('display-foto').src = data.foto;
                    if(data.nombre) document.getElementById('display-nombre').innerText = data.nombre;
                    if(data.descripcion) document.getElementById('display-desc').innerText = data.descripcion;
                }
            } catch (error) { console.error("Error cargando perfil:", error); }
        }

        async function fetchAndSort(coleccionStr) {
            const snapshot = await getDocs(collection(db, coleccionStr));
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
            return items;
        }

        function dibujarBotones(items, contenedorId, tituloId, estiloExtra = "") {
            const contenedor = document.getElementById(contenedorId);
            const titulo = document.getElementById(tituloId);
            if (items.length > 0) {
                titulo.style.display = 'block'; 
                contenedor.innerHTML = ''; 
                items.forEach((data) => {
                    const boton = document.createElement('a');
                    boton.href = data.url;
                    boton.className = 'btn';
                    if(estiloExtra) boton.style.border = estiloExtra; 
                    boton.target = '_blank';
                    boton.innerHTML = `<i class="${data.icono}"></i> ${data.titulo}`;
                    contenedor.appendChild(boton);
                });
            } else {
                titulo.style.display = 'none'; 
            }
        }

        async function cargarTodo() {
            await cargarPerfil(); 
            try {
                dibujarBotones(await fetchAndSort("redes_claudia"), 'contenedor-redes', 'titulo-redes');
                const recomendadosFull = await fetchAndSort("videos_claudia");
                dibujarBotones(recomendadosFull.filter(v => v.icono === "fas fa-star"), 'contenedor-destacado', 'titulo-destacado', '2px solid #FFD700'); 
                dibujarBotones(recomendadosFull.filter(v => v.icono === "fab fa-youtube"), 'contenedor-youtube', 'titulo-youtube', '2px solid #FF0000'); 
                dibujarBotones(recomendadosFull.filter(v => v.icono === "fas fa-ticket-alt"), 'contenedor-shows', 'titulo-shows', '2px solid #1e88e5'); 
                dibujarBotones(recomendadosFull.filter(v => v.icono === "fas fa-play-circle"), 'contenedor-videosgen', 'titulo-videosgen', '2px solid #555'); 

                const qrsItems = await fetchAndSort("qrs_claudia");
                const grid = document.getElementById('qrGrid');
                if(qrsItems.length > 0) {
                    qrsItems.forEach((data) => {
                        const item = document.createElement('div');
                        item.className = 'qr-item';
                        item.innerHTML = `<a href="${data.url || '#'}" target="_blank" class="qr-link"><h3 class="${data.colorClass}"><i class="${data.icono}"></i> ${data.titulo}</h3></a><img src="${data.imagenUrl}" alt="QR" class="qr-code">`;
                        grid.appendChild(item);
                    });
                }
            } catch (error) { console.error("Error cargando enlaces:", error); }
        }
        cargarTodo();
    </script>
</body>
</html>
