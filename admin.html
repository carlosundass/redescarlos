<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; margin-bottom: 20px; }
        input, select, textarea, button { font-family: 'Poppins', sans-serif; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 1rem; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: #111; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #333; }
        .btn-red { background: #e50914; } .btn-red:hover { background: #b20710; }
        .btn-qr { background: #8940FA; } .btn-qr:hover { background: #6b2ac4; }
        .btn-perfil { background: #1e88e5; } .btn-perfil:hover { background: #1565c0; }
        h2 { margin-top: 0; text-align: center; font-size: 1.3rem; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        #admin-panel { display: none; width: 100%; max-width: 500px; }
        
        /* Lista de elementos del panel */
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        .item-lista span { display: flex; align-items: center; gap: 8px; font-weight: 500; flex-grow: 1; text-align: left; }
        .controles-lista { display: flex; gap: 5px; }
        .btn-mover, .btn-editar, .btn-borrar { padding: 6px 10px; border-radius: 6px; width: auto; margin: 0; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-mover { background: #e0e0e0; color: #333; } .btn-mover:hover { background: #ccc; }
        .btn-editar { background: #ffc107; color: #000; } .btn-editar:hover { background: #e0a800; }
        .btn-borrar { background: #ff4d4d; color: white; } .btn-borrar:hover { background: #cc0000; }
        .contenedor-lista { margin-top: 20px; border-top: 2px dashed #eee; padding-top: 15px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="card" id="login-box">
        <h2>Entrar al Panel</h2>
        <input type="email" id="email" placeholder="Tu correo">
        <input type="password" id="password" placeholder="Tu contraseña">
        <button id="btnLogin">Ingresar</button>
    </div>

    <div id="admin-panel">
        
        <div class="card">
            <h2>👤 Perfil Principal</h2>
            <input type="url" id="img-perfil" placeholder="URL de tu Foto (Ej: https://...)">
            <input type="text" id="nombre-perfil" placeholder="Tu Nombre o Título Principal">
            <textarea id="desc-perfil" placeholder="Tu biografía o descripción"></textarea>
            <button id="btnGuardarPerfil" class="btn-perfil">Actualizar Perfil</button>
        </div>

        <div class="card" id="seccion-redes">
            <h2>📱 Redes Sociales</h2>
            <input type="text" id="titulo-red" placeholder="Título (Ej: Mi Instagram)">
            <input type="url" id="url-red" placeholder="URL (Ej: https://instagram.com/...)">
            <select id="icono-red">
                <option value="fab fa-instagram">📸 Instagram</option>
                <option value="fab fa-tiktok">🎵 TikTok</option>
                <option value="fab fa-youtube">▶️ YouTube</option>
                <option value="fab fa-spotify">🎧 Spotify</option>
                <option value="fab fa-whatsapp">💬 WhatsApp</option>
                <option value="fas fa-podcast">🎙️ Podcast</option>
                <option value="fas fa-globe">🌐 Sitio Web</option>
            </select>
            <button id="btnGuardarRed">Guardar Red Social</button>
            <button id="btnCancelarRed" style="display:none; background: #888; margin-top: 0;">Cancelar Edición</button>
            <div class="contenedor-lista" id="lista-redes"></div>
        </div>

        <div class="card" id="seccion-videos">
            <h2>🎬 Categorías (Videos, Shows)</h2>
            <input type="text" id="titulo-video" placeholder="Título (Ej: Show en Coquimbo)">
            <input type="url" id="url-video" placeholder="URL de compra o video">
            <select id="icono-video">
                <option value="fas fa-ticket-alt">🎫 Entradas / Show</option>
                <option value="fab fa-youtube">▶️ YouTube</option>
                <option value="fas fa-play-circle">⏯️ Video General</option>
                <option value="fas fa-star">⭐ Destacado</option>
            </select>
            
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 5px; font-weight: 600;">Campos extras solo para Shows:</p>
            <input type="url" id="extra-imagen" placeholder="URL de la Imagen/Afiche del Show">
            <input type="text" id="extra-lugar" placeholder="Nombre del Lugar (Ej: Restobar El Cohete)">
            <input type="text" id="extra-direccion" placeholder="Dirección (Ej: Av. Costanera 123, Coquimbo)">
            
            <label style="font-size: 0.85rem; color: #555; display: block; margin-bottom: 5px; text-align: left;">Fecha del Show:</label>
            <input type="date" id="extra-fecha">
            
            <input type="text" id="extra-hora" placeholder="Hora (Ej: 22:00hrs.)">

            <button id="btnGuardarVideo" class="btn-red">Guardar Enlace</button>
            <button id="btnCancelarVideo" style="display:none; background: #888; margin-top: 0;">Cancelar Edición</button>
            <div class="contenedor-lista" id="lista-videos"></div>
        </div>

        <div class="card" id="seccion-qrs">
            <h2>🔳 Códigos QR Adicionales</h2>
            <select id="color-qr">
                <option value="title-ig">Color Instagram (Rosa)</option>
                <option value="title-tk">Color TikTok (Negro)</option>
                <option value="title-yt">Color YouTube (Rojo)</option>
            </select>
            <input type="text" id="titulo-qr" placeholder="Título">
            <select id="icono-qr"><option value="fas fa-link">🔗 Enlace Genérico</option></select>
            <input type="url" id="img-qr" placeholder="URL del QR">
            <button id="btnGuardarQR" class="btn-qr">Guardar QR Extra</button>
            <button id="btnCancelarQR" style="display:none; background: #888; margin-top: 0;">Cancelar Edición</button>
            <div class="contenedor-lista" id="lista-qrs"></div>
        </div>

        <button id="btnLogout" style="background: #dc3545; margin-top: 20px;">Cerrar Sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCNyzguxQ8g3_xXRisuk01SKVaZ4H9JLxI",
            authDomain: "mis-enlaces-panel.firebaseapp.com",
            projectId: "mis-enlaces-panel",
            storageBucket: "mis-enlaces-panel.firebasestorage.app",
            messagingSenderId: "27134948574",
            appId: "1:27134948574:web:1d261e7ced5c7f9c9e7e4f",
            measurementId: "G-FST917JFZ9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let editando = { redes: null, videos: null, qrs: null };

        document.getElementById('btnLogin').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(() => alert("Error de ingreso"));
        });
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            document.getElementById('login-box').style.display = user ? 'none' : 'block';
            document.getElementById('admin-panel').style.display = user ? 'block' : 'none';
            if(user) { cargarListas(); cargarPerfilAdmin(); }
        });

        async function cargarPerfilAdmin() {
            const docSnap = await getDoc(doc(db, "configuracion", "perfil"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('img-perfil').value = data.foto || '';
                document.getElementById('nombre-perfil').value = data.nombre || '';
                document.getElementById('desc-perfil').value = data.descripcion || '';
            }
        }

        document.getElementById('btnGuardarPerfil').addEventListener('click', async () => {
            await setDoc(doc(db, "configuracion", "perfil"), {
                foto: document.getElementById('img-perfil').value,
                nombre: document.getElementById('nombre-perfil').value,
                descripcion: document.getElementById('desc-perfil').value
            });
            alert("¡Perfil guardado!");
        });

        async function fetchAndSort(coleccionStr) {
            const snapshot = await getDocs(collection(db, coleccionStr));
            const items = [];
            snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
            items.forEach((item, idx) => item.orden = idx);
            return items;
        }

        async function guardarOActualizar(coleccionStr, data, inputsLimpiar, idEdicion) {
            try {
                if (idEdicion) {
                    await updateDoc(doc(db, coleccionStr, idEdicion), data);
                    limpiarEdicion(coleccionStr);
                } else {
                    const itemsActuales = await fetchAndSort(coleccionStr);
                    data.orden = itemsActuales.length; 
                    data.fecha = new Date();
                    await addDoc(collection(db, coleccionStr), data);
                }
                inputsLimpiar.forEach(id => document.getElementById(id).value = '');
                cargarListas(); 
            } catch (e) { alert("Error al guardar datos."); }
        }

        function limpiarEdicion(coleccionStr) {
            if (coleccionStr === 'redes') {
                editando.redes = null;
                document.getElementById('btnGuardarRed').innerText = "Guardar Red Social";
                document.getElementById('btnCancelarRed').style.display = "none";
            } else if (coleccionStr === 'videos') {
                editando.videos = null;
                document.getElementById('btnGuardarVideo').innerText = "Guardar Enlace";
                document.getElementById('btnCancelarVideo').style.display = "none";
            } else if (coleccionStr === 'qrs') {
                editando.qrs = null;
                document.getElementById('btnGuardarQR').innerText = "Guardar QR Extra";
                document.getElementById('btnCancelarQR').style.display = "none";
            }
        }

        document.getElementById('btnCancelarRed').addEventListener('click', () => { limpiarEdicion('redes'); ['titulo-red', 'url-red'].forEach(id => document.getElementById(id).value = ''); });
        document.getElementById('btnCancelarVideo').addEventListener('click', () => { limpiarEdicion('videos'); ['titulo-video', 'url-video', 'extra-imagen', 'extra-lugar', 'extra-direccion', 'extra-fecha', 'extra-hora'].forEach(id => document.getElementById(id).value = ''); });
        document.getElementById('btnCancelarQR').addEventListener('click', () => { limpiarEdicion('qrs'); ['titulo-qr', 'img-qr'].forEach(id => document.getElementById(id).value = ''); });

        document.getElementById('btnGuardarRed').addEventListener('click', () => {
            const titulo = document.getElementById('titulo-red').value;
            const url = document.getElementById('url-red').value;
            if(titulo && url) guardarOActualizar("redes", { titulo, url, icono: document.getElementById('icono-red').value }, ['titulo-red', 'url-red'], editando.redes);
        });

        document.getElementById('btnGuardarVideo').addEventListener('click', () => {
            const titulo = document.getElementById('titulo-video').value;
            const url = document.getElementById('url-video').value;
            if(titulo && url) {
                guardarOActualizar("videos", { 
                    titulo, 
                    url, 
                    icono: document.getElementById('icono-video').value,
                    imagen: document.getElementById('extra-imagen').value || '',
                    lugarShow: document.getElementById('extra-lugar').value || '',
                    direccionShow: document.getElementById('extra-direccion').value || '',
                    fechaShow: document.getElementById('extra-fecha').value || '',
                    horaShow: document.getElementById('extra-hora').value || ''
                }, ['titulo-video', 'url-video', 'extra-imagen', 'extra-lugar', 'extra-direccion', 'extra-fecha', 'extra-hora'], editando.videos);
            }
        });

        document.getElementById('btnGuardarQR').addEventListener('click', () => {
            const titulo = document.getElementById('titulo-qr').value;
            const imagenUrl = document.getElementById('img-qr').value;
            if(titulo && imagenUrl) guardarOActualizar("qrs", { titulo, imagenUrl, colorClass: document.getElementById('color-qr').value, icono: 'fas fa-link' }, ['titulo-qr', 'img-qr'], editando.qrs);
        });

        async function cargarListas() {
            dibujarLista(await fetchAndSort("redes"), 'lista-redes', 'redes');
            dibujarLista(await fetchAndSort("videos"), 'lista-videos', 'videos');
            dibujarLista(await fetchAndSort("qrs"), 'lista-qrs', 'qrs');
        }

        function dibujarLista(items, contenedorId, coleccionStr) {
            const contenedor = document.getElementById(contenedorId);
            contenedor.innerHTML = '';
            items.forEach((data, index) => {
                const div = document.createElement('div');
                div.className = 'item-lista';
                div.innerHTML = `
                    <span>${data.titulo}</span>
                    <div class="controles-lista">
                        ${index > 0 ? `<button class="btn-mover" data-id="${data.id}" data-swap-id="${items[index-1].id}" data-orden="${data.orden}" data-swap-orden="${items[index-1].orden}">⬆️</button>` : ''}
                        ${index < items.length - 1 ? `<button class="btn-mover" data-id="${data.id}" data-swap-id="${items[index+1].id}" data-orden="${data.orden}" data-swap-orden="${items[index+1].orden}">⬇️</button>` : ''}
                        <button class="btn-editar" data-id="${data.id}">✏️</button>
                        <button class="btn-borrar" data-id="${data.id}">🗑️</button>
                    </div>
                `;
                contenedor.appendChild(div);

                // Evento Editar Blindado
                div.querySelector('.btn-editar').addEventListener('click', () => {
                    if (coleccionStr === 'redes') {
                        document.getElementById('titulo-red').value = data.titulo || '';
                        document.getElementById('url-red').value = data.url || '';
                        document.getElementById('icono-red').value = data.icono || '';
                        editando.redes = data.id;
                        document.getElementById('btnGuardarRed').innerText = "Actualizar Red Social";
                        document.getElementById('btnCancelarRed').style.display = "block";
                        document.getElementById('seccion-redes').scrollIntoView({ behavior: 'smooth' });
                    } else if (coleccionStr === 'videos') {
                        document.getElementById('titulo-video').value = data.titulo || '';
                        document.getElementById('url-video').value = data.url || '';
                        document.getElementById('icono-video').value = data.icono || '';
                        document.getElementById('extra-imagen').value = data.imagen || '';
                        document.getElementById('extra-lugar').value = data.lugarShow || '';
                        document.getElementById('extra-direccion').value = data.direccionShow || '';
                        document.getElementById('extra-fecha').value = data.fechaShow || '';
                        document.getElementById('extra-hora').value = data.horaShow || '';
                        editando.videos = data.id;
                        document.getElementById('btnGuardarVideo').innerText = "Actualizar Enlace";
                        document.getElementById('btnCancelarVideo').style.display = "block";
                        document.getElementById('seccion-videos').scrollIntoView({ behavior: 'smooth' });
                    } else if (coleccionStr === 'qrs') {
                        document.getElementById('titulo-qr').value = data.titulo || '';
                        document.getElementById('img-qr').value = data.imagenUrl || '';
                        document.getElementById('color-qr').value = data.colorClass || '';
                        editando.qrs = data.id;
                        document.getElementById('btnGuardarQR').innerText = "Actualizar QR Extra";
                        document.getElementById('btnCancelarQR').style.display = "block";
                        document.getElementById('seccion-qrs').scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            // Evento Borrar Corregido
            contenedor.querySelectorAll('.btn-borrar').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const idBorrar = btn.getAttribute('data-id');
                    if(confirm("¿Estás seguro de borrar este elemento?")) { 
                        await deleteDoc(doc(db, coleccionStr, idBorrar)); 
                        cargarListas(); 
                    }
                });
            });

            // Evento Mover Corregido
            contenedor.querySelectorAll('.btn-mover').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id1 = btn.getAttribute('data-id'); const id2 = btn.getAttribute('data-swap-id');
                    const ord1 = Number(btn.getAttribute('data-orden')); const ord2 = Number(btn.getAttribute('data-swap-orden'));
                    await updateDoc(doc(db, coleccionStr, id1), { orden: ord2 }); await updateDoc(doc(db, coleccionStr, id2), { orden: ord1 });
                    cargarListas();
                });
            });
        }
    </script>
</body>
</html>
